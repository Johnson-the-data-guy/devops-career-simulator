<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps career simulator</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --border:#e3e5ea;
    --text-primary:#191d28;
    --text-secondary:#6b7280;
    --text-faint:#9aa0ab;
    --accent:#3f3ac9;
    --accent-soft:#eeeefc;
    --done:#15803d;
    --shift:#b45309;
    --shift-soft:#fdf3e3;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101219;
      --card:#191c26;
      --border:#292d3a;
      --text-primary:#e8e9ef;
      --text-secondary:#969aa8;
      --text-faint:#6e7280;
      --accent:#948ef8;
      --accent-soft:#22233d;
      --done:#4ade80;
      --shift:#f0b45e;
      --shift-soft:#2b2210;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:20px 13px 70px;line-height:1.5;
  }
  .wrap{max-width:540px;margin:0 auto;}
  h1{font-size:19px;font-weight:600;margin-bottom:3px;}
  .sub{font-size:13px;color:var(--text-secondary);margin-bottom:18px;}
  .overall{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 17px;margin-bottom:18px;}
  .overall-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .overall-top span:first-child{font-size:13px;color:var(--text-secondary);}
  .overall-top span:last-child{font-family:var(--mono);font-size:13px;color:var(--accent);}
  .bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;}

  .project{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .phead{padding:15px 17px;cursor:pointer;display:flex;flex-direction:column;gap:5px;}
  .ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .pnum{font-family:var(--mono);font-size:11px;color:var(--accent);}
  .ptitle{font-size:15px;font-weight:600;}
  .pcount{font-family:var(--mono);font-size:12px;color:var(--text-secondary);white-space:nowrap;}
  .pstack{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
  .pbrief{font-size:13px;color:var(--text-secondary);}
  .pbar{height:3px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:3px;}
  .pbar-fill{height:100%;background:var(--done);border-radius:99px;transition:width .3s ease;}
  .chev{display:inline-block;font-family:var(--mono);color:var(--text-faint);transition:transform .2s ease;}
  .phead.open .chev{transform:rotate(90deg);}

  .body{display:none;border-top:1px solid var(--border);padding:4px 10px 10px;}
  .body.open{display:block;}
  .phase{margin-top:12px;}
  .phase-head{padding:7px 8px;border-radius:8px;background:var(--accent-soft);margin-bottom:3px;}
  .phase-head.shift{background:var(--shift-soft);}
  .phase-tag{font-family:var(--mono);font-size:10px;color:var(--accent);display:block;}
  .phase-head.shift .phase-tag{color:var(--shift);}
  .phase-name{font-size:13px;font-weight:600;}
  .task{display:flex;gap:11px;align-items:flex-start;padding:9px 8px;border-radius:9px;}
  .task:hover{background:var(--accent-soft);}
  .task input{margin-top:3px;width:15px;height:15px;accent-color:var(--done);flex-shrink:0;cursor:pointer;}
  .tlabel{font-size:14px;}
  .tconcept{font-family:var(--mono);font-size:11px;color:var(--text-faint);display:block;margin-top:2px;}
  .task.checked .tlabel{color:var(--text-secondary);text-decoration:line-through;}
</style>
</head>
<body>
<div class="wrap">
  <h1>DevOps career simulator</h1>
  <p class="sub">Twelve companies. Real scenarios that change under you. Built against a senior-level job spec.</p>

  <div class="overall">
    <div class="overall-top"><span>Overall progress</span><span id="oc">0 / 0</span></div>
    <div class="bar"><div class="bar-fill" id="ob" style="width:0%"></div></div>
  </div>

  <div id="projects"></div>
</div>

<script>
const PROJECTS = [
 {id:'cafe',n:'01',title:'Milk & Bean',stack:'static HTML · café website',brief:'The owner has a site on a USB stick and no idea what hosting means. Get it online.',
  phases:[
   {tag:'phase_1',name:'Get it online',shift:false,tasks:[
    {c:'client-server model',t:'Explain to me, in your own words, what a server actually is and why the café needs one.'},
    {c:'EC2 · SSH',t:'Launch your first EC2 instance and SSH into it.'},
    {c:'Linux · nginx',t:'Install nginx, deploy the static site, load it in a browser.'},
    {c:'DNS · Route 53',t:'Point a domain at it. Explain what happens between typing the URL and the page loading.'}]},
   {tag:'phase_2',name:'"It\'s slow abroad and the bill is scary"',shift:true,tasks:[
    {c:'S3 · static hosting',t:'Move the static assets to S3. Explain why that\'s cheaper than an always-on EC2.'},
    {c:'CDN · CloudFront',t:'Put a CDN in front. Test load time before and after.'},
    {c:'IAM basics',t:'You\'ve been using the root user this whole time. Fix that — and tell me why it mattered.'},
    {c:'cost awareness',t:'Right-size the instance. Show the before/after monthly cost.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'Write the README: what you built, why each piece exists, what breaks without it.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'studio',n:'02',title:'Northwind Design Studio',stack:'Node.js · creative agency',brief:'Three designers, one dev, deploys done by dragging files over FTP. Something breaks weekly.',
  phases:[
   {tag:'phase_1',name:'Stop the manual deploys',shift:false,tasks:[
    {c:'git branching',t:'Set up a branching model. Explain why trunk-based vs git-flow matters for a team this size.'},
    {c:'GitHub Actions',t:'Write your first workflow: install deps, run tests, on every push.'},
    {c:'CI/CD',t:'Extend it to deploy automatically to the EC2 box on merge to main.'},
    {c:'secrets in CI',t:'Get credentials out of the workflow file and into GitHub secrets.'}]},
   {tag:'phase_2',name:'"A bad deploy took us down for 3 hours"',shift:true,tasks:[
    {c:'environments',t:'Add a staging environment that mirrors production.'},
    {c:'rollback',t:'Design and implement a rollback path. Test that it actually works.'},
    {c:'branch protection',t:'Require passing checks before merge. Nobody pushes to main directly.'},
    {c:'collaboration',t:'The lead dev wants to bypass staging "just for hotfixes." Write your response to him.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + a diagram of the pipeline.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'logistics',n:'03',title:'Roadrunner Logistics',stack:'Python/Flask · delivery startup',brief:'Everything sits in one public subnet, database included. Their auditor noticed.',
  phases:[
   {tag:'phase_1',name:'Build a real network',shift:false,tasks:[
    {c:'CIDR · subnetting',t:'Subnet 10.0.0.0/16 by hand on paper before touching AWS. Show me your math.'},
    {c:'VPC',t:'Build the VPC: two public subnets, two private, across two AZs.'},
    {c:'routing · IGW · NAT',t:'Wire up route tables, internet gateway, NAT gateway. Explain the traffic path for each.'},
    {c:'ALB',t:'Put an ALB in the public subnets, app servers in private. Confirm the app is unreachable directly.'}]},
   {tag:'phase_2',name:'"Depot staff need access from the warehouse"',shift:true,tasks:[
    {c:'security groups · NACLs',t:'Explain the difference, then implement the right one for this requirement.'},
    {c:'bastion · VPN',t:'Give ops secure admin access without exposing SSH to the internet.'},
    {c:'troubleshooting',t:'I\'ll break the routing. You diagnose it — with commands, not guesses.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + network diagram.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'cratebox',n:'04',title:'CrateBox',stack:'Go · shipping platform',brief:'"Works on my machine" is now a company-wide crisis. Two environments, three different Go versions.',
  phases:[
   {tag:'phase_1',name:'Containerize it',shift:false,tasks:[
    {c:'docker fundamentals',t:'Explain images vs containers vs layers before writing a Dockerfile.'},
    {c:'Dockerfile',t:'Write a working Dockerfile for the Go app. Run it locally.'},
    {c:'ECR',t:'Push the image to ECR and pull it onto a server.'}]},
   {tag:'phase_2',name:'"Images are 1.2GB and security found a CVE"',shift:true,tasks:[
    {c:'multi-stage builds',t:'Get that image under 50MB. Explain what you removed and why it was there.'},
    {c:'Trivy · image scanning',t:'Scan the image. Fix what\'s fixable, document what isn\'t.'},
    {c:'container hardening',t:'Stop running as root inside the container. Explain the attack this prevents.'},
    {c:'AI validation',t:'I\'ll give you an AI-generated Dockerfile with real flaws. Find them before I tell you.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + before/after image size and scan results.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'scriptly',n:'05',title:'Scriptly',stack:'Python · Bash · ops-heavy SaaS',brief:'Four engineers spend their mornings doing the same manual checks. You\'re here to delete that work.',
  phases:[
   {tag:'phase_1',name:'Automate the morning routine',shift:false,tasks:[
    {c:'bash scripting',t:'Write a Bash script that cleans old logs and reports disk usage.'},
    {c:'boto3 · sessions',t:'Python script: inventory every EC2 instance with its state, type, and tags.'},
    {c:'error handling',t:'Make it survive an API failure gracefully instead of crashing halfway.'}]},
   {tag:'phase_2',name:'"We\'re paying for resources nobody owns"',shift:true,tasks:[
    {c:'automation · tagging',t:'Find every untagged or idle resource and report it.'},
    {c:'scheduled jobs',t:'Run it automatically — cron or Lambda. Justify your pick.'},
    {c:'safe automation',t:'Add a dry-run mode. Explain why a script that deletes things needs one.'},
    {c:'AI validation',t:'I\'ll hand you an AI-written cleanup script with a destructive bug. Catch it.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + sample output.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'groundwork',n:'06',title:'Groundwork Builders',stack:'Java/Spring · construction SaaS',brief:'Everything was built by clicking in the console. The person who built it left. Nobody knows what exists.',
  phases:[
   {tag:'phase_1',name:'Codify the infrastructure',shift:false,tasks:[
    {c:'terraform basics',t:'Providers, resources, state — explain what state actually is before you write HCL.'},
    {c:'terraform · VPC/EC2',t:'Reproduce the network from project 03 entirely in Terraform.'},
    {c:'RDS',t:'Add a managed database. Explain why not self-hosted MySQL on EC2.'},
    {c:'remote state',t:'Move state to S3 with locking. Explain what breaks without the lock.'}]},
   {tag:'phase_2',name:'"Staging and prod have quietly drifted apart"',shift:true,tasks:[
    {c:'terraform modules',t:'Refactor into reusable modules.'},
    {c:'environments',t:'One codebase, two environments, different variables. No copy-paste.'},
    {c:'drift detection',t:'A dev changed something in the console. Find it with terraform plan and decide what to do.'},
    {c:'collaboration',t:'Write the team policy for console changes. Make it something devs will actually follow.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + module structure explanation.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'orbital',n:'07',title:'OrbitalScale Gaming',stack:'Node.js · multiplayer game',brief:'Launch day in three weeks. They expect 10x traffic for six hours, then near-silence overnight.',
  phases:[
   {tag:'phase_1',name:'Get onto Kubernetes',shift:false,tasks:[
    {c:'k8s objects',t:'Pods, deployments, services — explain each with the café analogy before deploying.'},
    {c:'EKS',t:'Stand up an EKS cluster and deploy the app to it.'},
    {c:'ingress',t:'Expose it properly. Explain how this differs from the ALB in project 03.'}]},
   {tag:'phase_2',name:'"Launch day — 10x traffic, then dead quiet"',shift:true,tasks:[
    {c:'HPA',t:'Configure horizontal pod autoscaling. Load-test it and watch it scale.'},
    {c:'requests · limits',t:'Set resource requests and limits. Explain what happens if you skip them.'},
    {c:'cluster autoscaler',t:'Scale the nodes too, not just the pods.'},
    {c:'rolling updates · probes',t:'Ship a new version with zero downtime. Add liveness and readiness probes.'}]},
   {tag:'phase_3',name:'"A pod keeps crashing in production"',shift:true,tasks:[
    {c:'troubleshooting',t:'I\'ll break something. Diagnose CrashLoopBackOff properly — logs, describe, events.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + load test results.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'pulse',n:'08',title:'PulseCheck',stack:'Python · health platform',brief:'They find out about outages from angry users on Twitter. In healthcare. That\'s the whole problem.',
  phases:[
   {tag:'phase_1',name:'See what\'s happening',shift:false,tasks:[
    {c:'metrics/logs/traces',t:'Explain the three, and when each one is the right tool.'},
    {c:'Prometheus',t:'Deploy Prometheus, scrape metrics from the app and nodes.'},
    {c:'Grafana',t:'Build a dashboard that answers "is the service healthy right now?" at a glance.'}]},
   {tag:'phase_2',name:'"200 alerts a day, the team ignores all of them"',shift:true,tasks:[
    {c:'SLI · SLO · error budget',t:'Define real SLIs and SLOs for this service. Justify the numbers.'},
    {c:'alerting',t:'Rewrite the alerts so every page is actionable. Delete the rest.'},
    {c:'centralized logging',t:'Aggregate logs so you can trace one request across services.'}]},
   {tag:'phase_3',name:'"Auditor: prove who accessed patient data"',shift:true,tasks:[
    {c:'CloudTrail · audit',t:'Set up audit logging and retention. Produce the evidence they asked for.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + dashboard screenshots + your SLO doc.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'juicyway',n:'09',title:'Juicyway',stack:'multi-service · fintech payments',brief:'Money moves through this system. Security review before launch, and you own the outcome.',
  phases:[
   {tag:'phase_1',name:'Lock it down',shift:false,tasks:[
    {c:'IAM least privilege',t:'Design roles and policies. No wildcards. Defend every permission you grant.'},
    {c:'Secrets Manager',t:'Remove every hardcoded credential from the codebase and pipeline.'},
    {c:'encryption',t:'Encrypt at rest and in transit. Explain KMS key management in plain terms.'},
    {c:'shared responsibility',t:'Draw the line: what AWS secures vs what you secure. Be specific to this stack.'}]},
   {tag:'phase_2',name:'"Pentest came back with findings"',shift:true,tasks:[
    {c:'SAST · SCA · secrets',t:'Add all three scan types to the pipeline. Explain what each catches that the others miss.'},
    {c:'severity tuning',t:'Fail the build on HIGH/CRITICAL only. Justify the tradeoff to a nervous CTO.'},
    {c:'network segmentation',t:'Segment the services so a breach in one doesn\'t reach the ledger.'}]},
   {tag:'phase_3',name:'"Who can touch production?"',shift:true,tasks:[
    {c:'access review · MFA',t:'Run an access audit. Enforce MFA and role assumption. Document the outcome.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + threat model + security decisions log.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'larkspur',n:'10',title:'Larkspur Retail',stack:'PHP · legacy monolith',brief:'A 12-year-old app in a dying data centre. Leadership wants it in AWS and wants the bill to go down.',
  phases:[
   {tag:'phase_1',name:'Migrate it',shift:false,tasks:[
    {c:'migration strategy',t:'Pick from the 6 Rs and defend your choice for this specific app.'},
    {c:'CloudFormation',t:'Do this one in CloudFormation, not Terraform. Then tell me which you prefer and why.'},
    {c:'legacy constraints',t:'Get the monolith running without rewriting it. Document what you had to work around.'}]},
   {tag:'phase_2',name:'"The AWS bill tripled"',shift:true,tasks:[
    {c:'cost analysis',t:'Find where the money is going. Cost Explorer, tags, the lot.'},
    {c:'right-sizing · spot',t:'Cut the bill by 40% without hurting performance. Show your working.'},
    {c:'S3 lifecycle',t:'Move old data to cheaper storage tiers automatically.'},
    {c:'communication',t:'Present the savings to non-technical leadership. One page, no jargon.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + cost before/after.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'vantage',n:'11',title:'Vantage Analytics',stack:'Python/Spark · data platform',brief:'Single AZ, single database, single point of failure. A competitor just lost a region for nine hours.',
  phases:[
   {tag:'phase_1',name:'Remove the single points of failure',shift:false,tasks:[
    {c:'multi-AZ',t:'Redesign for multi-AZ. Identify every remaining SPOF and list them.'},
    {c:'RDS Multi-AZ · replicas',t:'Make the database survive an AZ loss. Explain replica lag and what it costs you.'},
    {c:'health checks',t:'Configure health checks that actually detect a sick instance, not just a dead one.'}]},
   {tag:'phase_2',name:'"What if we lose the whole region?"',shift:true,tasks:[
    {c:'RTO · RPO',t:'Define both with the business. Explain the cost of each tighter target.'},
    {c:'DR strategies',t:'Compare backup/restore, pilot light, warm standby. Recommend one with reasoning.'},
    {c:'failover drill',t:'Actually run the failover. Time it. Document what went wrong.'}]},
   {tag:'submit',name:'Submit & reflect',shift:false,tasks:[
    {c:'portfolio',t:'README + DR runbook + drill results.'},
    {c:'reflection',t:'Submit for review, then write your blind-spot summary.'}]}]},

 {id:'meridian',n:'12',title:'Meridian Cloud',stack:'everything · capstone',brief:'You own the whole platform now. No safety net. This is the interview you\'re training for.',
  phases:[
   {tag:'phase_1',name:'Own it',shift:false,tasks:[
    {c:'runbooks',t:'Write runbooks for the five most likely failures. Assume the reader is half asleep.'},
    {c:'on-call',t:'Design the on-call rotation and escalation path.'}]},
   {tag:'phase_2',name:'Chaos day',shift:true,tasks:[
    {c:'chaos engineering',t:'Design three chaos experiments with a clear hypothesis for each.'},
    {c:'MTTD',t:'Execute them. Time how long your own monitoring takes to notice.'}]},
   {tag:'phase_3',name:'The incident',shift:true,tasks:[
    {c:'incident response',t:'I\'ll trigger a real multi-layer failure. Detect, mitigate, communicate, resolve.'},
    {c:'5 whys · postmortem',t:'Write the blameless postmortem. Root cause, not symptom.'}]},
   {tag:'submit',name:'Final review',shift:false,tasks:[
    {c:'portfolio',t:'Assemble all 12 projects into one portfolio.'},
    {c:'interview prep',t:'I interview you against the job spec. No notes.'}]}]}
];

const KEY='devops-sim-v1';
let state={};

async function load(){try{const r=await window.storage.get(KEY,false);if(r&&r.value)state=JSON.parse(r.value);}catch(e){state={};}}
async function save(){try{await window.storage.set(KEY,JSON.stringify(state),false);}catch(e){console.error(e);}}
const tid=(p,ph,i)=>p+':'+ph+':'+i;

function render(){
  const root=document.getElementById('projects');
  const open=new Set([...root.querySelectorAll('.body.open')].map(e=>e.dataset.pid));
  root.innerHTML='';
  let total=0,done=0;

  PROJECTS.forEach(p=>{
    let pt=0,pd=0;
    p.phases.forEach(ph=>ph.tasks.forEach((t,i)=>{pt++;if(state[tid(p.id,ph.tag,i)])pd++;}));
    total+=pt;done+=pd;

    const el=document.createElement('div');el.className='project';
    const head=document.createElement('div');
    head.className='phead'+(open.has(p.id)?' open':'');
    head.innerHTML=`<div class="ptop"><span><span class="pnum">${p.n}</span> <span class="ptitle">${p.title}</span></span>
      <span class="pcount">${pd}/${pt} <span class="chev">›</span></span></div>
      <div class="pstack">${p.stack}</div>
      <div class="pbrief">${p.brief}</div>
      <div class="pbar"><div class="pbar-fill" style="width:${pt?(pd/pt)*100:0}%"></div></div>`;

    const body=document.createElement('div');
    body.className='body'+(open.has(p.id)?' open':'');
    body.dataset.pid=p.id;

    p.phases.forEach(ph=>{
      const pe=document.createElement('div');pe.className='phase';
      pe.innerHTML=`<div class="phase-head${ph.shift?' shift':''}">
        <span class="phase-tag">${ph.tag}</span><span class="phase-name">${ph.name}</span></div>`;
      ph.tasks.forEach((t,i)=>{
        const id=tid(p.id,ph.tag,i);const on=!!state[id];
        const te=document.createElement('label');
        te.className='task'+(on?' checked':'');
        te.innerHTML=`<input type="checkbox" ${on?'checked':''} data-id="${id}">
          <span><span class="tlabel">${t.t}</span><span class="tconcept">${t.c}</span></span>`;
        pe.appendChild(te);
      });
      body.appendChild(pe);
    });

    head.addEventListener('click',()=>{body.classList.toggle('open');head.classList.toggle('open');});
    el.appendChild(head);el.appendChild(body);root.appendChild(el);
  });

  document.getElementById('oc').textContent=done+' / '+total;
  document.getElementById('ob').style.width=(total?(done/total)*100:0)+'%';

  root.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',async e=>{
      state[e.target.dataset.id]=e.target.checked;
      await save();render();
    });
  });
}
(async()=>{await load();render();})();
</script>
</body>
</html>
